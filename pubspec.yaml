name: japanese_walking_app
description: A beautiful interval walking app inspired by Japanese aesthetics
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Routing
  go_router: ^12.1.1
  
  # UI & Animations
  google_fonts: ^6.1.0
  animations: ^2.0.8
  fl_chart: ^0.66.0
  
  # Utilities
  intl: ^0.18.1
  shared_preferences: ^2.2.2

  # Audio & Haptic
  just_audio: ^0.9.36
  vibration: ^1.8.4

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
